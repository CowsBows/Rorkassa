<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rørkassa – ingen nett</title>
<style>
  html,body{margin:0;height:100%;background:#203b34;color:#f4eee2;font:17px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
  main{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:max(32px,env(safe-area-inset-top)) 28px max(32px,env(safe-area-inset-bottom))}
  svg{width:96px;height:96px}
  h1{margin:0;font-size:24px;font-weight:750}
  p{margin:0;max-width:320px;color:#d9d2c3}
  button{margin-top:8px;border:0;border-radius:12px;padding:14px 28px;background:#e68a4c;color:#1c2b26;font:inherit;font-weight:700}
  button:active{opacity:.85}
  #status{min-height:1.4em;font-size:15px;color:#b9c7bf}
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 64 64" aria-hidden="true"><g transform="translate(32 32) scale(.8) translate(-32 -33.1)"><path d="M15 12H32A10 10 0 0 1 42 22V28" fill="none" stroke="#E68A4C" stroke-width="12"/><rect x="12" y="3" width="7" height="18" rx="2" fill="#E68A4C"/><rect x="32" y="26" width="20" height="7" rx="2.5" fill="#E68A4C"/><path d="M42 36c0 0-10 11.2-10 17.2a10 10 0 0 0 20 0C52 47.2 42 36 42 36z" fill="#F4EEE2"/></g></svg>
  <h1>Ingen nettforbindelse</h1>
  <p>Rørkassa trenger nett for å starte. Jobbene, timene og notatene dine ligger trygt lagret på telefonen.</p>
  <button id="retry" type="button">Prøv igjen</button>
  <div id="status" role="status"></div>
</main>
<script>
  var URL_RK = 'https://rorkassa.net/';
  function retry() {
    document.getElementById('status').textContent = 'Prøver igjen …';
    window.location.href = URL_RK;
  }
  document.getElementById('retry').addEventListener('click', retry);
  window.addEventListener('online', retry);
</script>
</body>
</html>
